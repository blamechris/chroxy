name: Nightly K8s Integration

on:
  schedule:
    # 06:00 UTC daily = previous evening US/Pacific (22:00 PT / 23:00 PDT)
    - cron: '0 6 * * *'
  workflow_dispatch:

# Prevent overlapping runs: a new dispatch (or schedule) cancels an in-flight
# run rather than spinning up a second kind cluster on the same runner pool.
concurrency:
  group: nightly-k8s-integration
  cancel-in-progress: true

# Read-only token — the job only reads the repo and talks to GitHub Checks.
permissions:
  contents: read

jobs:
  k8s-sidecar-integration:
    name: K8s Sidecar Integration
    runs-on: ubuntu-24.04
    # 15 min: cluster boot (~2 min) + image build/load (~2 min) + test suite
    # (~3 min) + cleanup (~1 min) + generous headroom for slow runners.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          # #7386: this is not only a convenience for this job — it is the
          # SCHEDULED FALLBACK producer of the hosted `node-cache-Linux-x64-npm-*`
          # entry that fork PRs on ubuntu-24.04 restore. ci.yml's `dashboard-smoke`
          # is the primary (every push to main); this one re-saves after the 7-day
          # eviction on a quiet week and covers a run where the primary is skipped.
          # Keep this job hosted, scheduled, and cached — ci-npm-cache-routing.test.js
          # asserts a scheduled producer exists and will fail if this stops being one.
          # See docs/decisions/2026-08-npm-cache-producer.md.
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      # helm/kind-action provisions a kind cluster and ensures the `kind` binary
      # is on PATH.  cluster_name is left as default ("chart-testing") because the
      # integration test creates its own named cluster (chroxy-test-<pid>) and the
      # action cluster is never actually used — we only need the kind binary.
      # Pinned to the most recent stable tag; bump when kind itself requires it.
      - name: Install kind
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          install_only: true

      - name: Install dependencies
        run: npm ci

      - name: Build @chroxy/protocol
        run: npm run build
        working-directory: packages/protocol

      # RUN_K8S_INTEGRATION=1 is the opt-in gate checked by the test file.
      # The script also probes for `kind` on PATH before registering any tests,
      # so a missing binary produces a clean skip rather than a crash.
      # The 14-minute timeout guard (just under the 15-minute job ceiling above,
      # so we exit with a diagnostic rather than take a hard runner kill) lives on
      # the `test:integration:k8s` script itself, because Node rejects
      # --test-timeout in NODE_OPTIONS and refuses to start at all.
      - name: Run K8s sidecar integration test
        run: npm run test:integration:k8s -w packages/server
        env:
          RUN_K8S_INTEGRATION: '1'
