  desktop-tests:
    name: Desktop Rust Tests
    # Runs on the self-hosted macOS runner (Apple Silicon) to avoid GitHub-hosted
    # macOS minutes (billed at 10x ubuntu). SECURITY: this repo is public, so the
    # job is gated to same-repo events only — fork PRs must NOT execute on the
    # self-hosted host. A fork PR touching desktop code simply skips this job
    # (maintainer can validate it locally / on a hosted re-run if needed).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/desktop/src-tauri
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Cache cargo registry and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('packages/desktop/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Create stub resource directories for Tauri build script
        run: mkdir -p server-bundle ../dist

      - name: Run tests
        run: cargo test --locked

      - name: Run verify-entitlements.sh tests (#4801)
        working-directory: packages/desktop
        run: bash scripts/verify-entitlements.test.sh

  desktop-tests-windows:
    name: Desktop Rust Tests (Windows)
    # Per-PR Windows compile + unit tests for the Tauri desktop crate on the
    # self-hosted `chroxy-win` runner. Catches Windows-only regressions in the
    # `#[cfg(windows)]` Rust and the bundle/resource path layout (e.g. #6640's
    # resolve_cli_js) that previously only surfaced at release-tag time. SECURITY:
    # same-repo only — a heavy Rust build must never run untrusted fork code on
    # the self-hosted box (mirrors the macOS `desktop-tests` gate); fork PRs skip.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, chroxy-win]
    timeout-minutes: 25
    defaults:
      run:
        working-directory: packages/desktop/src-tauri
        # Windows PowerShell, NOT bash or pwsh — see the Server Windows Tests
        # job (self-hosted `bash` is WSL bash with no distro; PowerShell Core
        # `pwsh` isn't installed on the runner).
        shell: powershell
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain
        # A self-hosted Windows runner has no preinstalled rustup (unlike
        # GitHub-hosted windows-latest), so `dtolnay/rust-toolchain` can't find
        # it. Install rustup on first use and add cargo to PATH; the MSVC target
        # links against the box's Visual Studio Build Tools (auto-detected via
        # vswhere). Cached under the runner's CARGO_HOME across runs.
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            $ProgressPreference = 'SilentlyContinue'
            $init = Join-Path $env:RUNNER_TEMP 'rustup-init.exe'
            Invoke-WebRequest -Uri 'https://win.rustup.rs/x86_64' -OutFile $init
            & $init -y --default-toolchain stable-x86_64-pc-windows-msvc --profile minimal
            if ($LASTEXITCODE -ne 0) { throw "rustup-init failed ($LASTEXITCODE)" }
            "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } else {
            rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal
            rustup default stable-x86_64-pc-windows-msvc
          }

      - name: Cache cargo registry and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('packages/desktop/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Create stub resource directories for the Tauri build script
        # tauri-build validates that `bundle.resources` paths exist; the real
        # server bundle is staged only for a full `cargo tauri build`, so stub
        # them for a compile/test pass (mirrors the macOS desktop-tests job).
        run: New-Item -ItemType Directory -Force -Path server-bundle, ../dist | Out-Null

      - name: Run desktop tests
        run: cargo test --locked

  renovate-config:
    name: Renovate Config
    # #7196 — validate renovate.json against a PINNED renovate.
    #
    # The version pin is the point. `npx --package renovate` with no version
    # reuses whatever is already in the local ~/.npm/_npx cache rather than
    # necessarily re-resolving, so the same command can validate against a
    # months-old renovate and reject a correct config — which is exactly what
    # happened while reviewing #7191 (a cached 37.x rejected the current
    # `managerFilePatterns` spelling). A gate that fails on correct input, or
    # passes on stale rules, is worse than no gate.
    #
    # Bumping this pin is deliberate work: renovate's schema moves, and the
    # bump should be the change that surfaces any migration, not a silent
    # drift underneath an unpinned command.
    needs: [runner-target, changes]
    if: needs.changes.outputs.renovate == 'true'
    runs-on: ${{ fromJSON(needs.runner-target.outputs.runner) }}  # SELF_HOSTED_OR_HOSTED (see header)
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # 24, not the repo's usual 22: renovate 44.x declares
          # `engines.node: ^24.11.0`, and running it under 22 only produces an
          # EBADENGINE warning today — an unsupported-engine combination is not
          # something a validation gate should be built on. Bump alongside
          # RENOVATE_VERSION below.
          node-version: 24
          # Reuse ~/.npm across runs so the validator's dependency tree is not
          # re-downloaded cold every time. Safe alongside the pin below: npx
          # resolves an explicit `renovate@<version>` spec regardless of what
          # is cached — the staleness that motivated pinning came from an
          # UNPINNED spec silently reusing whatever the cache held.
          cache: npm
          # Glob, not the bare root lockfile: this monorepo has three
          # (root, packages/server, packages/server/sidecar) and the cache key
          # must cover all of them. packages/server/tests/ci-cache-key.test.js
          # enforces this for every job in this file.
          cache-dependency-path: '**/package-lock.json'

      - name: Validate renovate.json
        env:
          # Keep in sync deliberately; see the note above before changing.
          RENOVATE_VERSION: 44.30.3
        run: |
          npx --yes --package "renovate@${RENOVATE_VERSION}" -- \
            renovate-config-validator --strict renovate.json

  scripts-tests:
    name: Scripts Tests
    needs: runner-target
    runs-on: ${{ fromJSON(needs.runner-target.outputs.runner) }}  # SELF_HOSTED_OR_HOSTED (see header)
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Run bump-version.sh tests
        run: bash scripts/__tests__/bump-version.test.sh

      - name: Run docker-entrypoint.sh tests
        # #7239 — the entrypoint hardcoded $HOME/.chroxy while the daemon
        # honours CHROXY_CONFIG_DIR, so a relocated container wrote config to
        # the mounted volume and read state from an unmounted path. Silent,
        # because the token survived via the exported API_TOKEN.
        run: bash scripts/__tests__/docker-entrypoint.test.sh

      - name: Run flush-and-exit.mjs tests
        run: node scripts/__tests__/flush-and-exit.test.mjs

      - name: Run compile-skill-targets.mjs tests
        run: node scripts/__tests__/compile-skill-targets.test.mjs

      - name: Run is-entry-point.mjs tests
        # Also the drift gate for the guard's three un-shareable copies
        # (scripts/lib, packages/server/src/utils, sidecar/agent.js) — #7222.
        run: node scripts/__tests__/is-entry-point.test.mjs

      - name: Run lint-no-raw-color-literals golden test
        run: bash scripts/__tests__/lint-no-raw-color-literals.test.sh

      - name: Run lint-no-nul-bytes golden test
        run: bash scripts/__tests__/lint-no-nul-bytes.test.sh

      - name: Check compiled skill artifacts are in sync with .claude/commands
        # #7253 — .claude/commands/<name>.md is the neutral source, but
        # .claude/skills/<name>/SKILL.md is what Claude actually LOADS (the
        # legacy .claude/commands/ discovery is broken — anthropics/claude-code#31846)
        # and .gemini/commands/<name>.toml is Gemini's. A stale artifact means the
        # skill you edited is not the skill that runs. Nothing gated that, and 11
        # had drifted on main while `catchup` had never been compiled at all.
        #
        # The script resolves its targets from .claude/skill-profile.md and gates
        # only the repo-local ones. codex and pi compile into ~/.codex and ~/.pi:
        # per-machine, opt-in, not version-controlled, and never touched by CI.
        # --check is read-only and refuses those targets outright.
        run: node scripts/compile-skill-targets.mjs --check

      - name: Check AGENTS.md is in sync with CLAUDE.md
        # AGENTS.md is generated from CLAUDE.md (the single source of truth) so
        # non-Claude agents get the same guidance. This gate fails if CLAUDE.md
        # changed without regenerating, or if AGENTS.md was hand-edited.
        run: node scripts/__tests__/gen-agents-md.test.mjs

      - name: Run check-release-pr-subject.mjs tests
        run: node scripts/__tests__/check-release-pr-subject.test.mjs

  release-pr-subject:
    name: Release PR Subject
    # #7184 — auto-tag-on-release.yml only fires on a merge subject matching
    # `^chore\(release\): cut vX.Y.Z`. A release PR merged under any other
    # subject silently skips the tag job: no tag, no release, no artifacts, and
    # a green check mark. That has cost two releases (#4627, and 0.10.0 which
    # produced the 463-commit gap in #7176).
    #
    # Content-triggered on purpose. Keying this to the subject would be
    # circular — the failure IS a wrong subject — so it asks "does this diff
    # look like a release?" (root version bump / CHANGELOG version heading) and
    # only then demands a subject that will tag.
    if: github.event_name == 'pull_request'
    needs: runner-target
    runs-on: ${{ fromJSON(needs.runner-target.outputs.runner) }}  # SELF_HOSTED_OR_HOSTED (see header)
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # The check diffs against the base branch; a shallow clone would make
          # that diff unavailable and the script fails closed (exit 2) rather
          # than silently passing.
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Would this PR's subject fire the auto-tag workflow?
        env:
          # Via env, not inline `${{ }}`, so a title containing shell
          # metacharacters cannot be interpolated into the command.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node scripts/check-release-pr-subject.mjs \
            --title "$PR_TITLE" \
            --number "$PR_NUMBER" \
            --base "$BASE_SHA" \
            --head HEAD

  dashboard-smoke:
    name: Dashboard Smoke (Playwright)
    # #6315: a UI-regression gate. Runs the Playwright dashboard smoke
    # (packages/server/tests/smoke-test.mjs) against a server it starts, and fails
    # the run on a non-zero exit. Pinned to a GitHub-HOSTED ubuntu runner (x86_64)
    # for first-class Playwright/chromium support, independent of the self-hosted
    # ARM64 pool the unit suites use (the smoke spawns chromium + a full daemon, so
    # the hosted, disposable, x86_64 environment is the right fit).
    #
    # DEFERRED — the Maestro APP E2E half of #6315: it needs a booted iOS simulator
    # + a dev-client build + Metro, which only a self-hosted macOS runner can host
    # and is too costly per-PR. Run it locally via
    # packages/app/.maestro/scripts/run-all-sequential.sh (documented in CLAUDE.md);
    # wiring it into CI (likely a nightly subset) remains tracked under #6315.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build dashboard
        run: npm run build -w @chroxy/dashboard

      - name: Install Playwright chromium
        working-directory: packages/server
        run: npx playwright install --with-deps chromium

      - name: Seed local server config
        # A fixed token + externalUrl: the externalUrl makes server-cmd skip the
        # Cloudflare tunnel (so cloudflared isn't needed), while keeping auth on so
        # the dashboard WebSocket actually connects (the --no-auth path leaves the
        # WS disconnected). The smoke reads this token to build the dashboard URL.
        # `cwd` pins the auto-created Default session at the tiny IDE fixture
        # workspace (#6500) so the go-to-def smoke's quick-open + resolve_symbol
        # are deterministic. `config.cwd` feeds `defaultCwd` verbatim (server-cli.js);
        # the path is inside the checkout so the session workspace is a real dir.
        run: |
          mkdir -p "$HOME/.chroxy"
          printf '{ "apiToken": "ci-smoke-token", "externalUrl": "http://localhost:8765", "tunnel": "quick", "cwd": "%s/packages/server/tests/fixtures/smoke-ide-workspace" }\n' "$GITHUB_WORKSPACE" > "$HOME/.chroxy/config.json"

      - name: Stub the `claude` binary
        # The daemon auto-creates a default claude-tui session on boot, whose
        # preflight requires a `claude` binary on PATH — which a hosted CI runner
        # doesn't have. The smoke never drives a real turn, so a no-op stub that
        # just stays alive in the PTY satisfies the existence check (preflight.js
        # isExecutableFile) and lets the daemon start. ~/.local/bin is both a
        # checked candidate path AND added to PATH for subsequent steps.
        run: |
          mkdir -p "$HOME/.local/bin"
          printf '#!/usr/bin/env bash\nexec cat >/dev/null\n' > "$HOME/.local/bin/claude"
          chmod +x "$HOME/.local/bin/claude"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Start chroxy server (background, no tunnel)
        working-directory: packages/server
        # CHROXY_ALLOW_UNPINNED_BOOT=1 lets the daemon boot without an identity
        # keychain (a fresh CI HOME has none) instead of refusing to start;
        # --skip-checks drops the preflight (cloudflared isn't installed and isn't
        # needed without a tunnel). The smoke test then FINDS this server on :8765.
        env:
          CHROXY_ALLOW_UNPINNED_BOOT: '1'
          # #6500 — advertise the opt-in IDE surface so the smoke can exercise
          # quick-open + go-to-definition end-to-end in a real browser.
          CHROXY_ENABLE_IDE: '1'
        run: |
          node src/cli.js start --skip-checks > /tmp/chroxy-server.log 2>&1 &
          echo "CHROXY_SERVER_PID=$!" >> "$GITHUB_ENV"
          # Wait up to 40s for the HTTP server to accept connections on :8765.
          for i in $(seq 1 40); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8765/ || true)"
            if [ "$code" = "200" ] || [ "$code" = "403" ]; then echo "server up ($code)"; exit 0; fi
            sleep 1
          done
          echo "::error::chroxy server did not come up within 40s"; tail -50 /tmp/chroxy-server.log; exit 1

      - name: Run dashboard smoke test
        working-directory: packages/server
        # SMOKE_REQUIRE_IDE=1 — the daemon above has features.ide on + the fixture
        # workspace as its cwd, so the go-to-def section must run (not skip): a
        # missing palette/fixture is a hard failure here, catching an IDE regression.
        env:
          SMOKE_REQUIRE_IDE: '1'
        run: node tests/smoke-test.mjs

      - name: Stop chroxy server
        if: always()
        run: |
          tail -30 /tmp/chroxy-server.log 2>/dev/null || true
          kill "$CHROXY_SERVER_PID" 2>/dev/null || true

      - name: Upload smoke screenshots on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dashboard-smoke-screenshots
          path: packages/server/tests/screenshots/
          if-no-files-found: ignore
