name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded in-progress runs on the same PR so a burst of pushes (fix
# commits, rebases) doesn't run the full matrix N times. Keying on the PR's
# source branch groups a PR's runs together; on push to main `head_ref` is empty
# so we fall back to the unique `run_id` — every main run gets its own group and
# is therefore never cancelled OR queued behind another main run (each validates
# a distinct merged commit and must complete).
concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

# SELF_HOSTED_OR_HOSTED runner routing
# ------------------------------------
# The `runner-target` job below computes the Linux runner label set ONCE and
# exposes it as a JSON-string output (`needs.runner-target.outputs.runner`).
# Jobs that opt into the routing declare `needs: runner-target` and
# `runs-on: ${{ fromJSON(needs.runner-target.outputs.runner) }}`. This routes
# them to the self-hosted Linux runner pool (labels
# self-hosted,Linux,chroxy-linux) for SAME-REPO pushes and PRs, keeping them off
# the GitHub-hosted bill. The selector is deliberately NOT arch-pinned: the pool
# is MIXED — ARM64 Docker members on the Mac plus an x86_64 Hyper-V VM member on
# the always-on Windows host. If no self-hosted Linux runner is online, those jobs queue
# until one appears. FORK PRs fall back to `ubuntu-24.04` (GitHub-hosted) so
# untrusted contributor code never executes on the self-hosted machine, while
# external contributors still get full CI.
#
# Deduplicating into a single output (vs the former ~200-char ternary that was
# copy-pasted into every job) gives the routing rule ONE source of truth — edit
# `runner-target` and every consumer follows. The cost is one extra
# job-scheduling hop and a `needs:` edge per consumer.
#
# The macOS desktop job uses the separate self-hosted macOS runner and routes on
# the same boolean inline in its `if:` (it has no shared `runs-on` array, so it
# is not a `runner-target` consumer). The Windows jobs route through a second
# output, `runner-target.outputs.winrunner`: the self-hosted `chroxy-win` box for
# same-repo events, `windows-latest` for fork PRs (untrusted code stays off the
# self-hosted box). The heavier Windows desktop Rust build is same-repo-only,
# mirroring the macOS desktop job. After the Linux runner was bumped to 24GB (#6046),
# Store Core Tests and App Tests moved to the self-hosted pool (their blocker was
# npm-ci/transform OOM, not arch). Server Tests moved too once #6075 made the
# suite container-portable (the 9 ARM64-container failures were genuine env
# differences — root-bypassed fs perms, $HOME assumptions, a uuidgen dependency —
# not RAM); see the server-tests job comment.

jobs:
  runner-target:
    name: Resolve Runner Target
    # Tiny hosted gate job that resolves the SELF_HOSTED_OR_HOSTED routing once
    # and exposes it as a JSON-string output, consumed downstream via
    # `runs-on: ${{ fromJSON(needs.runner-target.outputs.runner) }}`:
    #   * SAME-REPO push or PR -> the JSON array
    #     ["self-hosted","Linux","chroxy-linux"] (fromJSON yields a label array
    #     -> self-hosted Linux pool; NOT arch-pinned, the pool is mixed).
    #   * FORK PR              -> the JSON string "ubuntu-24.04"
    #     (fromJSON yields the plain string -> GitHub-hosted).
    # MUST stay GitHub-hosted: a fork PR has to be able to resolve the target
    # WITHOUT scheduling anything on the self-hosted machine, so this gate job
    # can never itself be self-hosted.
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      runner: ${{ steps.resolve.outputs.runner }}
      winrunner: ${{ steps.resolve.outputs.winrunner }}
    steps:
      - id: resolve
        # The condition is the same routing predicate the per-job ternary used:
        # push events and same-repo PRs are trusted; fork PRs are not.
        #   * runner    — Linux pool (label `chroxy-linux`) / ubuntu-24.04 for forks
        #   * winrunner — Windows pool (self-hosted chroxy-win) / windows-latest for forks
        run: |
          if [ "${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}" = "true" ]; then
            echo 'runner=["self-hosted", "Linux", "chroxy-linux"]' >> "$GITHUB_OUTPUT"
            echo 'winrunner=["self-hosted", "Windows", "X64", "chroxy-win"]' >> "$GITHUB_OUTPUT"
          else
            echo 'runner="ubuntu-24.04"' >> "$GITHUB_OUTPUT"
            echo 'winrunner="windows-latest"' >> "$GITHUB_OUTPUT"
          fi
  server-tests:
    name: Server Tests
    # Moved to the self-hosted Linux pool (#6075). #6046 left this GitHub-hosted
    # because 9 tests failed on the ARM64 Linux container from genuine env
    # differences; #6075 made the suite container-portable (root bypasses POSIX
    # perm bits → skip those asserts; tests that assumed the repo lives under
    # $HOME now use $HOME-relative paths; the per-turn hook filenames fall back
    # to /proc/sys/kernel/random/uuid when uuidgen is absent). Verified 0-fail
    # on node:22-bookworm as root. Fork PRs still route to ubuntu-24.04 via
    # runner-target (untrusted code never runs on the self-hosted machine).
    #
    # RUNNER CONTRACT (#6094): this job has NO `container:` key, so its uid/image
    # come from how the self-hosted Linux runner agent is configured, OUT OF BAND
    # from this repo. The pool is now HETEROGENEOUS in uid, not just arch:
    #   * Mac Docker members — ROOT (uid 0) in node:22-bookworm, ARM64
    #   * winbox member      — NON-root (uid 1001) on an Ubuntu VM, x86_64
    # POSIX_PERM_SKIP (packages/server/tests/test-helpers.js) skips the four
    # chmod-denial asserts only when `process.getuid() === 0`, so those four RUN
    # on the winbox member and SKIP on the Docker members. That is fine and was
    # verified empirically before the pool went mixed: the four permission-guarded
    # suites were run on the winbox VM as uid 1001 — 77/77 pass, 0 skipped (real
    # ext4 enforces mode bits, which is exactly what the asserts expect; it is
    # root-in-container that bypasses them). If they ever fail there, investigate
    # the runner's uid/image and filesystem first, not the tests. (Pinning
    # `container: node:22-bookworm` would make this uniform, but the other
    # self-hosted Linux consumers are container-less too — pool-wide decision,
    # left for a follow-up.)
    needs: runner-target
    runs-on: ${{ fromJSON(needs.runner-target.outputs.runner) }}  # SELF_HOSTED_OR_HOSTED (see header)
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/server
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Build @chroxy/protocol
        run: npm run build
        working-directory: packages/protocol

      - name: Run tests with coverage
        run: npm test
        env:
          # #5579: arm the reverse-index drift assert (#5563) so the production
          # assert path runs across the full server suite, not just the
          # in-test parity oracle. Cheap O(clients × sessions) check per
          # mutation; surfaces a desync between the per-client Sets and the
          # sessionId→clients reverse index immediately.
          CHROXY_WS_INDEX_ASSERT: '1'

      - name: Upload server coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-coverage
          path: packages/server/coverage/
          retention-days: 14

  changes:
    name: Detect Changed Paths
    # Lightweight ubuntu job that classifies which paths a PR touches so
    # downstream jobs can self-gate. Today this only feeds the Windows
    # platform-tests job (#5002) — `windows-latest` is billed at a 5x
    # multiplier vs `ubuntu-24.04`, so we only fire it on PRs that touch
    # the files it actually covers. Pushes to `main` skip this job and
    # always run the Windows suite (the `server-tests-windows` job carries no
    # `if:` of its own — it runs on every same-repo event).
    needs: runner-target
    runs-on: ${{ fromJSON(needs.runner-target.outputs.runner) }}  # SELF_HOSTED_OR_HOSTED (see header)
    timeout-minutes: 2
    if: github.event_name == 'pull_request'
    # `dorny/paths-filter` calls the GitHub REST API (`listFiles`) to read the
    # PR's changed-file list on `pull_request` events. The workflow-level
    # `permissions: contents: read` block at the top of this file zeros out
    # every other scope, so we have to re-grant `pull-requests: read` at the
    # job level — without it, the API call fails with "Resource not accessible
    # by integration" on fork PRs and (potentially) any future GitHub change
    # that tightens the implicit same-repo grant. Same-repo PRs happen to work
    # today via the implicit token grant, but the explicit permission is what
    # the action documents and what survives a fork PR.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      platform: ${{ steps.filter.outputs.platform }}
      renovate: ${{ steps.filter.outputs.renovate }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - id: filter
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        with:
          filters: |
            platform:
              # Source — the production Windows code path lives in
              # platform.js today, but glob with `platform*` so a future
              # `platform-windows.js` / `platform-posix.js` split still
              # triggers the Windows job without an edit here.
              - 'packages/server/src/platform*.js'
              # Tests — both the cross-platform suite (exercises the
              # Windows branch via `_isWindowsOverride`) and the
              # Windows-only suite. Glob covers any future
              # platform-*.test.js additions.
              - 'packages/server/tests/platform*.test.js'
              # Workflow itself — so edits to this gating logic always
              # exercise the gated job on the same PR.
              - '.github/workflows/ci.yml'
            renovate:
              # #7196 — renovate.json is exercised by nothing else in CI, so an
              # edit can reintroduce invalid or deprecated syntax with nothing
              # catching it before merge. That is exactly how it accumulated the
              # deprecated regexManagers/fileMatch spelling #7191 had to fix.
              - 'renovate.json'
              - '.github/workflows/ci.yml'

  server-tests-windows:
    name: Server Windows Tests
    # Windows coverage for the platform / spawn / binary-resolution / WSL layers
    # on a REAL Windows host. Runs on the self-hosted `chroxy-win` runner for
    # same-repo events (free, always-on) and falls back to `windows-latest` for
    # fork PRs (untrusted code never touches the self-hosted box) — see the
    # `winrunner` output on `runner-target`.
    #
    # Scope is DERIVED, not curated (#7270): every packages/server/tests/**.test.js
    # runs here except the rows in WINDOWS_EXEMPT
    # (packages/server/scripts/lib/windows-test-set.mjs), each of which carries a
    # reason category and a measured symptom. A new test file is therefore covered
    # by default. The ubuntu `server-tests` job remains the coverage source of
    # truth (c8 runs there, not here). Now that this runs on the free self-hosted
    # box it fires on every same-repo push/PR (the old platform-changed-only gate
    # existed only to spare windows-latest minutes).
    #
    # The manifest itself is gated in `Server Lint`, which is a REQUIRED status
    # check — this job is not one, so a manifest defect has to be caught
    # somewhere that actually blocks a merge.
    needs: runner-target
    runs-on: ${{ fromJSON(needs.runner-target.outputs.winrunner) }}
    # 15 was sized for EIGHT files (~4s of test time). The derived set is ~483,
    # and the first real run of it on chroxy-win took 2m39s end to end (checkout
    # + npm ci + protocol build + 99s of tests). 20 is that with room for a slow
    # npm ci and a busy box, without tying up the single Windows runner for half
    # an hour when something genuinely hangs — a timeout kill is
    # indistinguishable from a hang, so this wants to be tight enough to be a
    # useful signal.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/server
        # Windows PowerShell, NOT bash: on a self-hosted Windows runner
        # `shell: bash` resolves to C:\Windows\System32\bash.exe (WSL), which has
        # no distro under the service account and fails every step. `pwsh`
        # (PowerShell Core) isn't installed on the box either, so use `powershell`
        # (Windows PowerShell 5.1, always present). The run commands are plain
        # npm/node invocations that behave identically under it.
        shell: powershell
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Build @chroxy/protocol
        run: npm run build
        working-directory: packages/protocol

      - name: Run the derived Windows server test set
        # #7270 — this step used to name EIGHT test files by hand while
        # packages/server/tests/ grew to 553. Anything added after that list was
        # written was never run on Windows and nobody was told; the job went
        # green in 58s and its green said nothing about the file. That is
        # docs/false-safety-guards.md's "Checked a subset" mode, in CI config.
        #
        # The list is INVERTED now: the runner walks every *.test.js, subtracts
        # WINDOWS_EXEMPT, and runs the rest — so a new test file is covered here
        # BY DEFAULT and a POSIX-only one has to be classified out, loudly.
        # Measured on the chroxy-win runner: 480 of 555 files run, 10,929 tests,
        # against the 193 this step used to run.
        #
        # ONE native command on purpose. The file list never crosses a command
        # line: the runner builds each batch's argv in-process and spawns with
        # shell:false, so neither CreateProcessW's 32,767-char cap nor cmd.exe's
        # 8,191 (which any .cmd shim — npm/npx/c8 — would impose) can apply.
        # $LASTEXITCODE is read on the very next statement and every branch
        # exits explicitly, so the "only the last exit code is checked" trap
        # cannot arise.
        #
        # Exit 2 means the runner could not do its job (a stale manifest, a
        # broken walk, an empty set) and is reported separately from exit 1:
        # "the guard broke" must not read as "the guard passed", nor as "the
        # code is dirty".
        run: |
          node ./scripts/run-windows-tests.mjs
          $rc = $LASTEXITCODE
          if ($rc -eq 0) {
            Write-Host "OK - the derived Windows test set ran clean"
            exit 0
          } elseif ($rc -eq 2) {
            Write-Host "::error::run-windows-tests could not run (stale or invalid WINDOWS_EXEMPT manifest, a broken walk, an empty run set, or a child that failed to spawn). The GUARD is broken, not necessarily the code."
            exit 1
          } else {
            Write-Host "::error::The derived Windows test set did not pass. If a TEST failed: fix it, or add a row to WINDOWS_EXEMPT in packages/server/scripts/lib/windows-test-set.mjs with a reason category, the measured symptom, and (for windows-defect / windows-slow) an issue number. If the run was UNREPORTABLE — no TAP summary, no file manifest, zero tests, cancelled tests, or a file set that does not match the derived set — the cause is printed immediately above and exempting a file is the wrong remedy."
            exit 1
          }

  server-lint:
    name: Server Lint
    needs: runner-target
    runs-on: ${{ fromJSON(needs.runner-target.outputs.runner) }}  # SELF_HOSTED_OR_HOSTED (see header)
    timeout-minutes: 5
    defaults:
      run:
        working-directory: packages/server
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Build @chroxy/protocol
        run: npm run build
        working-directory: packages/protocol

      - name: Lint
        run: npm run lint

      - name: Check the Windows test-exemption manifest is honest
        # #7270 — the Windows job used to run eight hardcoded test files out of
        # 553. The list is inverted now: every *.test.js runs on Windows unless
        # WINDOWS_EXEMPT classifies it out.
        #
        # This is the half that runs HERE, on Linux, in a REQUIRED check.
        # `Server Windows Tests` is NOT a required context, so a red Windows job
        # does not block a merge; if the only check on this manifest lived
        # inside that job the whole thing would be advisory —
        # docs/false-safety-guards.md's "Never reached" mode.
        #
        # It checks the MANIFEST, not the tests: stale rows, unknown reason
        # categories, tracked-debt rows with no issue, missing measured
        # symptoms, duplicates, an exempt ratio above the ceiling, and any
        # MUST_RUN_ON_WINDOWS suite relocated into the exempt list. Linux is
        # also the stricter host for the stale-row direction, because NTFS is
        # case-insensitive and would match a row that is stale everywhere else.
        #
        # Exit 2 ("the gate could not run") is surfaced separately from exit 1
        # ("the manifest is wrong").
        run: |
          set +e
          scripts/lint-windows-test-exemptions.sh
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "OK - every server test file either runs on Windows or is exempt with a machine-checked reason"
          elif [ "$rc" -eq 2 ]; then
            echo "::error::lint-windows-test-exemptions could not run (bad flags, an exempt row pointing at a missing file, or a walk below --min-files). The GUARD is broken, not necessarily the code."
            exit 1
          else
            echo "::error::The Windows exemption manifest is stale, over-broad, or exempts a must-run suite. See packages/server/scripts/lib/windows-test-set.mjs."
            exit 1
          fi

      - name: Check server lockfile freshness
        run: |
          npm install --package-lock-only
          git diff --exit-code package-lock.json || {
            echo "::error::packages/server/package-lock.json is stale. Run 'cd packages/server && npm install --package-lock-only' and commit the result."
            exit 1
          }

      - name: Check tests pass stateFilePath to SessionManager
        run: |
          # Issue #4633 — every `new SessionManager(...)` in tests must include
          # a `stateFilePath` option, otherwise the test writes to the real
          # ~/.chroxy/session-state.json (or, in CI, to the runner home).
          # The sandbox guard in tests/_setup.mjs (loaded via `node --import`)
          # patches the write-side of `fs` to throw on real-home writes — it
          # does NOT override HOME — so accidental contamination fails loudly,
          # but the explicit option keeps the intent obvious in review and
          # avoids surprise side effects.
          if scripts/lint-tests-state-file-path.sh; then
            echo "OK — every new SessionManager(...) in tests passes stateFilePath"
          else
            echo "::error::Tests instantiated SessionManager without stateFilePath. See packages/server/scripts/lint-tests-state-file-path.sh."
            exit 1
          fi

      - name: Check session subclasses forward every BaseSession opt
        run: |
          # Issue #4797 — every provider session class that extends
          # BaseSession (or JsonlSubprocessSession) must destructure AND
          # forward every BaseSession constructor opt via super({ ... }).
          # The "middle-layer trap" documented in project memory as
          # feedback_jsonl_subprocess_middle_layer.md has bitten three times
          # (#3224, #3231, #4790). This lint blocks the next recurrence at
          # PR time instead of catching it in production.
          #
          # Exit 2 is reported separately from 1, matching the config-dir step
          # below: the lint uses 2 for "could not run" (a stripper that will not
          # load, a file it cannot read, BASE_SESSION_OPT_KEYS drift) and 1 for
          # "a subclass drops an opt". Collapsing them told the operator to go
          # looking for an opt-drop that does not exist (#7248 review).
          set +e
          scripts/lint-session-opt-forwarding.sh
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "OK — every session subclass forwards every BaseSession opt"
          elif [ "$rc" -eq 2 ]; then
            echo "::error::lint-session-opt-forwarding could not run (the comment stripper failed to load or read a file, or BASE_SESSION_OPT_KEYS has drifted from the BaseSession ctor). The GUARD is broken, not necessarily the code. See packages/server/scripts/lint-session-opt-forwarding.mjs."
            exit 1
          else
            echo "::error::A provider session class drops a BaseSession opt on its way to super(). See packages/server/scripts/lint-session-opt-forwarding.sh."
            exit 1
          fi

      - name: Check session-aware modules use loggerForSession
        run: |
          # Issue #4792 — durable follow-up to #4787 / #4793. Session-aware
          # modules (claude-tui-session.js, handlers/input-handlers.js, ...)
          # MUST import `loggerForSession` from logger.js so per-session log
          # lines carry sessionId. Without it the WsServer log fan-out
          # (#4787 defensive filter) silently drops the entry from bound
          # dashboard clients — operators lose useful diagnostics.
          # The lint is ratcheted by file; see scripts/lint-logger-session-scoping.mjs
          # for the enforced set.
          if scripts/lint-logger-session-scoping.sh; then
            echo "OK — enforced modules use loggerForSession"
          else
            echo "::error::A session-aware module dropped its loggerForSession import or introduced a bare createLogger. See packages/server/scripts/lint-logger-session-scoping.sh."
            exit 1
          fi

      - name: Check reverse-index mutations route through ws-client-manager
        run: |
          # Issue #5579 — the sessionId→clients reverse index (#5575) only
          # stays correct if every change to a client's active session or
          # subscription Set goes through the index-maintaining mutators on
          # ws-client-manager.js. A bare `client.activeSessionId = x` or
          # `client.subscribedSessionIds.add(...)` elsewhere silently drifts
          # the index. This lint forbids those outside the owner file (the two
          # guarded #5563 fixture fallbacks carry a lint-ignore comment).
          if scripts/lint-ws-index-mutations.sh; then
            echo "OK — no bare reverse-index mutations outside ws-client-manager.js"
          else
            echo "::error::A bare reverse-index mutation was found outside ws-client-manager.js. See packages/server/scripts/lint-ws-index-mutations.sh."
            exit 1
          fi

      - name: Check ClaudeByokSession subclasses declare claudeFamily explicitly
        run: |
          # Issue #5891 — Claude-family membership (strict vs soft-fallback model
          # id validation) is the single `static claudeFamily` flag. A new class
          # that `extends ClaudeByokSession` and forgets `static claudeFamily =
          # false` silently inherits `true` and is mis-classified. This lint
          # requires every subclass to declare membership explicitly.
          if scripts/lint-claude-family-explicit.sh; then
            echo "OK — every ClaudeByokSession subclass declares static claudeFamily"
          else
            echo "::error::A class extending ClaudeByokSession is missing an explicit static claudeFamily. See packages/server/scripts/lint-claude-family-explicit.sh."
            exit 1
          fi

      - name: Check ~/.chroxy resolves through config-dir.js (server + claude-hooks JS)
        run: |
          # Issue #7052 — CHROXY_CONFIG_DIR must relocate ALL daemon state. It
          # relocated only half of it, because a `const` freezes at import: 16
          # module-scope constants stayed home-rooted, and 16 other modules grew
          # their own inline `process.env.CHROXY_CONFIG_DIR || …` copy to work
          # around that. Both shapes are banned; configDir()/configPath() read
          # the env per call. The lint is ratcheted by file — see
          # scripts/lint-config-dir-baseline.txt, which may shrink, never grow.
          #
          # #7239 — the step name says what is actually covered. The walk is
          # packages/server/src + packages/claude-hooks/src, .js/.mjs/.cjs.
          # Shell resolvers (scripts/docker-entrypoint.sh) and .ts sources are
          # NOT covered by this gate; the old name implied the whole repo was.
          #
          # Exit 2 means the lint could not do its job (bad flags, or it scanned
          # fewer files than its floor) and is reported separately from exit 1
          # — "the guard broke" must never be shown as "the code is dirty", and
          # must never be silently green.
          set +e
          scripts/lint-config-dir.sh
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "OK — ~/.chroxy resolves through src/config-dir.js"
          elif [ "$rc" -eq 2 ]; then
            echo "::error::lint-config-dir could not run (bad flags, or it scanned fewer files than --min-files). The GUARD is broken, not necessarily the code. See packages/server/scripts/lint-config-dir.mjs."
            exit 1
          else
            echo "::error::A file resolves ~/.chroxy outside src/config-dir.js, or a baseline entry is stale. See packages/server/scripts/lint-config-dir.sh."
            exit 1
          fi

      - name: Check no hand-rolled entry-point guard exists (JS/TS sources in the repository)
        run: |
          # Issue #7235 — #7198 and the #7213 sweep found one guard hand-rolled
          # in four files, and ALL FOUR were wrong. Its failure mode is SILENCE:
          # the guard reads false, main() never runs, the process exits 0. #7222
          # added a drift gate keeping the three surviving copies identical, but
          # that gate iterates a hardcoded three-element list, so a FOURTH copy
          # is invisible to it. This lint is the other half: it walks the tree
          # and fails on any entry-point determination outside the sanctioned
          # set.
          #
          # Deliberately not scoped to packages/server: two of the three
          # sanctioned copies live outside it, and so could a fourth. The step
          # name says what is actually covered, because a gate that overclaims
          # in its own title is #7239 — walked are
          # .js/.mjs/.cjs/.ts/.mts/.cts/.tsx/.jsx that git considers part of the
          # repository. NOT walked: shell (docker-entrypoint.sh's `node -e` uses
          # the same argv slot for a config path), the 65 committed files under
          # generated dist/, and anything gitignored — notably
          # packages/desktop/src-tauri/server-bundle/, a generated copy of the
          # server that lags its source and still holds pre-#7217 guards.
          #
          # Exit 2 means the lint could not do its job (bad flags, a sanctioned
          # path that vanished, or it walked fewer files than its floor) and is
          # reported separately from exit 1 — "the guard broke" must never be
          # shown as "the guard passed", nor as "the code is dirty".
          set +e
          scripts/lint-entry-point-guard.sh
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "OK — entry-point-ness is decided in the sanctioned files only"
          elif [ "$rc" -eq 2 ]; then
            echo "::error::lint-entry-point-guard could not run (bad flags, a stale allowlist entry, or it walked fewer files than --min-files). The GUARD is broken, not necessarily the code. See packages/server/scripts/lint-entry-point-guard.mjs."
            exit 1
          else
            echo "::error::A file decides 'was this module run directly?' by hand, or a sanctioned-copy allowlist entry is stale. Import isEntryPoint instead. See packages/server/scripts/lint-entry-point-guard.sh."
            exit 1
          fi

