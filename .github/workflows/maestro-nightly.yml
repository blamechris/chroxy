# Maestro app E2E — nightly (#6355, the deferred half of #6315).
#
# The Playwright dashboard smoke is a per-PR CI gate; the Maestro APP E2E suite
# was deferred from per-PR because it needs a booted iOS simulator + a built dev
# client + Metro. Run once a night on a hosted macOS 15 image with Xcode 16.4:
# Expo SDK 54 needs Simulator.app, which Xcode 27 removed (#7113).
# `run-all-sequential.sh`
# runs each flow in its own maestro process and retries a failure once — the
# resilient runner required over `run-all.yaml` on a single simulator (#6091).
name: Maestro App E2E (nightly)

on:
  schedule:
    # ~01:00 America/Los_Angeles (09:00 UTC). Adjust to a runner-idle window.
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      flow:
        description: Run the full inventory or diagnose the first flow
        type: choice
        required: true
        default: all
        options:
          - all
          - connect-screen.yaml

# Never overlap with a still-running prior night.
concurrency:
  group: maestro-nightly
  cancel-in-progress: true

permissions:
  contents: read

# npm's implicit audit + funding calls off for every install here (#7616) —
# see the block in ci.yml for the outage that motivated it. Required by
# scripts/lint-workflow-npm-env.mjs.
env:
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

jobs:
  maestro:
    name: Maestro App E2E
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # Check the exact prerequisites Expo and the suite need before an expensive
      # npm install or native build. Selects an iPhone 16 Pro with iOS 18.5 and
      # exports DEVICE for the build and flow steps.
      - name: Preflight Xcode and boot simulator
        run: bash scripts/maestro-hosted-preflight.sh

      - name: Install dependencies
        run: npm ci

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # Builds + installs the chroxy dev client (com.blamechris.chroxy) into the
      # simulator WITHOUT starting Metro (started separately below so it can run
      # in the background while Maestro drives the app). ~10-15 min cold.
      - name: Build + install the dev client
        working-directory: packages/app
        run: npx expo run:ios --device "$DEVICE" --no-bundler

      - name: Start Metro (background)
        working-directory: packages/app
        run: |
          npx expo start --localhost > "$RUNNER_TEMP/metro.log" 2>&1 &
          echo "METRO_PID=$!" >> "$GITHUB_ENV"
          # Wait for the bundler to answer before running flows.
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8081/status >/dev/null 2>&1; then
              echo "Metro up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::Metro did not answer on :8081 within 60s" >&2
          exit 1

      # /status only proves Metro is listening. A fresh hosted runner still has
      # to compile the iOS bundle, which can outlast a flow's UI wait. Fetch
      # Expo's actual iOS launch asset to completion before starting Maestro.
      - name: Warm the iOS Metro bundle
        run: node scripts/maestro-warm-metro.mjs

      # run-all-sequential.sh parses the flow inventory from run-all.yaml, starts/
      # reuses the mock server on :9876 itself, runs each flow in its own maestro
      # process, retries a failing flow once, and exits non-zero on a real failure.
      # A diagnostic dispatch runs only the first flow. Full runs stop after
      # three failed flows so a broken shared setup cannot consume the whole job.
      - name: Run Maestro suite
        env:
          MAESTRO_FLOW: ${{ inputs.flow || 'all' }}
          MAESTRO_ARTIFACT_DIR: ${{ runner.temp }}/maestro-diagnostics
        run: |
          case "$MAESTRO_FLOW" in
            all)
              bash packages/app/.maestro/scripts/run-all-sequential.sh --device "$DEVICE" --max-failures 3
              ;;
            connect-screen.yaml)
              bash packages/app/.maestro/scripts/run-all-sequential.sh --device "$DEVICE" --flow connect-screen.yaml --retries 0 --max-failures 1
              ;;
            *) echo "::error::Unexpected Maestro flow: $MAESTRO_FLOW" >&2; exit 2 ;;
          esac

      - name: Stop Metro
        if: always()
        run: kill "${METRO_PID}" 2>/dev/null || true

      - name: Upload this run's Maestro diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maestro-diagnostics
          path: |
            ${{ runner.temp }}/maestro-diagnostics/
            ${{ runner.temp }}/metro.log
          retention-days: 7
          if-no-files-found: warn
