name: Maestro Settings navigation diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: maestro-settings-probe-${{ github.ref }}
  cancel-in-progress: false
env:
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"
  DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
jobs:
  settings:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Preflight Xcode and boot simulator
        run: bash scripts/maestro-hosted-preflight.sh
      - name: Install pinned Maestro
        env:
          MAESTRO_VERSION: '2.12.0'
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version
      - name: Compare native Settings navigation and OFF guard
        timeout-minutes: 23
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '180000'
          MAESTRO_CLI_NO_ANALYTICS: 'true'
          MAESTRO_DISABLE_UPDATE_CHECK: 'true'
        run: python3 scripts/maestro-settings-navigation-probe.py
      - name: Stop disposable simulator
        if: always()
        run: |
          if [ -n "${DEVICE:-}" ]; then
            xcrun simctl shutdown "$DEVICE"
            xcrun simctl list devices available -j
          fi
      - name: Retain this disposable Settings diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: settings-navigation-8845
          path: ${{ runner.temp }}/maestro-diagnostics/
          retention-days: 7
          if-no-files-found: error
