appId: com.blamechris.chroxy
name: Wait for Chroxy dev client
---

# iOS asks once before opening the dev-client link in Chroxy. This system
# confirmation survives clearState. Wait for that exact prompt or a real app /
# dev-menu element before handling either path; optional taps while loading
# miss sheets that appear later.
- extendedWaitUntil:
    visible:
      text: '.*(Open in [“"]Chroxy[”"]\?|Welcome to Chroxy|Connect to Chroxy|Connecting|Chat|Reload|Continue).*'
    timeout: 90000

- runFlow:
    when:
      visible:
        text: '^Open in [“"]Chroxy[”"]\?$'
    commands:
      - tapOn:
          text: "^Open$"

# Hosted cold dispatch took 93 seconds after Open before Chroxy started;
# bundle loading and the Expo sheet still follow. Give actual app/dev-menu
# readiness its own bounded allowance before any introduction/menu taps.
- extendedWaitUntil:
    visible:
      text: ".*(Welcome to Chroxy|Connect to Chroxy|Connecting|Chat|Reload|Continue).*"
    timeout: 180000

# Expo's project-load error also offers Reload. Reject its exact title before
# treating Reload as a development-menu action; keep the real app anchor below.
- assertNotVisible:
    text: '^There was a problem loading the project\.$'

- runFlow:
    when:
      visible:
        text: "^Continue$"
    commands:
      - tapOn:
          text: "^Continue$"
      - waitForAnimationToEnd

# The main dev menu can appear after the intro sheet. Its Reload action is a
# menu signal only after rejecting the project-load error; do not tap it
# over the app itself.
- runFlow:
    when:
      visible:
        text: "^Reload$"
    commands:
      - tapOn:
          point: "93%,43%"
      - waitForAnimationToEnd

- runFlow:
    when:
      visible:
        text: "^Skip$"
    commands:
      - tapOn:
          text: "^Skip$"
      - waitForAnimationToEnd

# A visible app control proves the native sheet no longer masks the app.
# Connecting/Cancel is a valid transient state for ensure-connect-screen's
# recovery branch; callers that need a session still wait for Connect or Chat.
- extendedWaitUntil:
    visible:
      text: "Connect to Chroxy|Chat|Connecting|Cancel"
    timeout: 15000
