appId: com.apple.Preferences
name: Disable Password AutoFill on the disposable hosted simulator
---
# Hosted fixture preparation only; ordinary local app flows do not call this.
# Avoid the transient password-saving service that races Maestro's iOS 26
# Safari hierarchy query. Keep Chroxy's inputs and authentication unchanged.
- launchApp

# A fresh simulator opens Settings home. Repeated preparation can already be
# on General or AutoFill & Passwords, so preserve those observed entry states.
- runFlow:
    when:
      notVisible:
        id: AutoFillToggle
    commands:
      - runFlow:
          when:
            notVisible:
              id: AUTOFILL
          commands:
            - tapOn:
                id: com.apple.settings.general
      - tapOn:
          id: AUTOFILL
          index: 0

- extendedWaitUntil:
    visible:
      id: AutoFillToggle
    timeout: 10000

# The ID covers the whole row. Its trailing switch is the actual control;
# a row-center tap leaves the value unchanged. Use a selector-relative point.
- runFlow:
    when:
      visible:
        id: AutoFillToggle
        checked: true
    commands:
      - tapOn:
          id: AutoFillToggle
          point: 88%,50%
      - waitForAnimationToEnd

# Idempotent if already OFF, and fail if navigation/tapping did not establish it.
- assertVisible:
    id: AutoFillToggle
    checked: false

- takeScreenshot: hosted-password-autofill-off
