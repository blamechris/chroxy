appId: com.blamechris.chroxy
name: ChatView ToolBubble collapsed-preview field-priority (#4260)
---

# The existing fixture starts one Bash tool with empty input, then sends
# three tool_input_delta chunks forming {"command":"ls -la /tmp"}.
# ChatView routes that singleton through ToolBubble. Its collapsed preview
# must show the command, while the tool remains in flight without a result.
# Requires a dev client and the mock server on port 9876.

- runFlow: setup/ensure-session-screen.yaml
- tapOn: "Chat"
- waitForAnimationToEnd
- tapOn:
    id: "chat-message-input"
- inputText: "show-bash-partial"
- hideKeyboard
- tapOn:
    id: "chat-send-button"
- extendedWaitUntil:
    visible:
      id: "tool-collapsed-preview"
    timeout: 10000
- assertVisible:
    id: "tool-collapsed-preview"
- assertVisible:
    text: "ls -la /tmp"
- takeScreenshot: chat-tool-partial-summary-preview-visible
